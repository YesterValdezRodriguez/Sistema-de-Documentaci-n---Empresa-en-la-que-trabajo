<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armador de Expedientes</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-in">
      <a href="#/plantillas" class="marca" style="color:#fff;text-decoration:none">
        Armador de Expedientes
        <small>Batch Records · Fórmulas Maestras</small>
      </a>
      <nav>
        <a href="#/plantillas" data-route="plantillas">Plantillas</a>
        <a href="#/armados" data-route="armados">Expedientes armados</a>
        <a href="#/archivos" data-route="archivos">Registros / PDFs</a>
        <a href="#/datos" data-route="datos">Datos / Respaldo</a>
      </nav>
    </div>
  </header>

  <main id="app">
    <div class="card"><p class="muted">Cargando…</p></div>
  </main>

  <footer>
    Aplicación local — funciona en su equipo, sin servidor ni internet. Sus datos no salen de este navegador.
  </footer>

  <div id="toasts"></div>

  <!-- Librería de PDF incluida localmente (funciona sin conexión) -->
  <script src="vendor/pdf-lib.min.js"></script>
  <!-- pdf.js para mostrar miniaturas de páginas (worker cargado como script para
       funcionar también al abrir con file:// sin servidor) -->
  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script src="vendor/pdfjs/pdf.worker.min.js"></script>
  <script>
    if (window.pdfjsLib) { pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdfjs/pdf.worker.min.js'; }
  </script>
  <script src="js/motor-pdf.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
