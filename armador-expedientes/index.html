<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#312e81">
  <meta name="description" content="Arma expedientes y batch records en PDF de forma local, sin servidor ni internet.">
  <title>Armador de Expedientes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2.5' y='2.5' width='19' height='19' rx='4' fill='%23eef0ff'/%3E%3Cpolygon points='12 5.5 19 9 12 12.5 5 9 12 5.5'/%3E%3Cpolyline points='5 13 12 16.5 19 13'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera" id="cabecera">
    <div class="cabecera-in">
      <a href="#/plantillas" class="marca">
        <span class="marca-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 8.5 12 15 2 8.5 12 2"></polygon><polyline points="2 13 12 19.5 22 13"></polyline></svg>
        </span>
        <span class="marca-txt">
          Armador de Expedientes
          <small>Batch Records · Fórmulas Maestras</small>
        </span>
      </a>
      <nav aria-label="Secciones">
        <a href="#/plantillas" data-route="plantillas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
          Plantillas
        </a>
        <a href="#/armados" data-route="armados">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>
          Expedientes armados
        </a>
        <a href="#/archivos" data-route="archivos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          Registros / PDFs
        </a>
        <a href="#/datos" data-route="datos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
          Datos / Respaldo
        </a>
      </nav>
    </div>
  </header>

  <main id="app">
    <div class="cargando"><span class="spinner" aria-hidden="true"></span><p>Cargando…</p></div>
  </main>

  <footer>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    Aplicación local — funciona en su equipo, sin servidor ni internet. Sus datos no salen de este navegador.
  </footer>

  <div id="toasts"></div>

  <!-- Librería de PDF incluida localmente (funciona sin conexión) -->
  <script src="vendor/pdf-lib.min.js"></script>
  <!-- pdf.js para mostrar miniaturas de páginas (worker cargado como script para
       funcionar también al abrir con file:// sin servidor) -->
  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script src="vendor/pdfjs/pdf.worker.min.js"></script>
  <script>
    if (window.pdfjsLib) { pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdfjs/pdf.worker.min.js'; }
  </script>
  <script src="js/motor-pdf.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <!-- Sombra de la cabecera al desplazarse (mejora visual, sin dependencias) -->
  <script>
    (function () {
      var h = document.getElementById('cabecera');
      if (!h) return;
      var aplicar = function () { h.classList.toggle('scrolled', window.scrollY > 4); };
      aplicar();
      window.addEventListener('scroll', aplicar, { passive: true });
    })();
  </script>
</body>
</html>
